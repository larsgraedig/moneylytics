logging:
  structured:
    format:
      console: ecs

server:
  forward-headers-strategy: framework

spring:
  application:
    name: api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/moneylyticsdb}
    username: ${SPRING_DATASOURCE_USERNAME:moneylytics}
    password: ${SPRING_DATASOURCE_PASSWORD:moneylytics}
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  flyway:
    enabled: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

app:
  oauth2-success-redirect: ${FRONTEND_URL:/}

springdoc:
  swagger-ui:
    enabled: false  # springdoc's UI router uses a Spring Framework 6 API removed in 7; we serve the UI manually

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  price-id-monthly: ${STRIPE_PRICE_ID_MONTHLY}
  price-id-yearly: ${STRIPE_PRICE_ID_YEARLY}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY}
