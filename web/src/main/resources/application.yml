spring:
  application:
    name: api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/moneylyticsdb}
    username: ${SPRING_DATASOURCE_USERNAME:moneylytics}
    password: ${SPRING_DATASOURCE_PASSWORD:moneylytics}
  jpa:
    hibernate:
      ddl-auto: update

springdoc:
  swagger-ui:
    enabled: false  # springdoc's UI router uses a Spring Framework 6 API removed in 7; we serve the UI manually
