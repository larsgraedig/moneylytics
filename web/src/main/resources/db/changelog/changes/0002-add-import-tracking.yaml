databaseChangeLog:
  - changeSet:
      id: "0002"
      author: "lgraedig"
      dbms: postgresql
      changes:
        - sqlFile:
            path: scripts/0002-add-import-tracking.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: false
      rollback:
        - dropIndex:
            indexName: idx_transaction_import_file_id
            tableName: transaction
        - dropIndex:
            indexName: idx_transaction_import_id
            tableName: transaction
        - dropColumn:
            tableName: transaction
            columnName: import_file_id
        - dropColumn:
            tableName: transaction
            columnName: import_id
        - dropIndex:
            indexName: idx_import_file_import_id
            tableName: import_file
        - dropTable:
            tableName: import_file
        - dropTable:
            tableName: import_preview_session
        - dropIndex:
            indexName: idx_transaction_import_org
            tableName: transaction_import
        - dropTable:
            tableName: transaction_import
