databaseChangeLog:
  - objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
  - changeSet:
      id: "0001"
      author: "lgraedig"
      dbms: postgresql
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: organization
      changes:
        # Sequences
        - createSequence:
            sequenceName: collections_id_seq
        - createSequence:
            sequenceName: transaction_groups_id_seq
        - createSequence:
            sequenceName: transaction_offsets_id_seq
        - createSequence:
            sequenceName: recurring_classifier_class_counts_id_seq
        - createSequence:
            sequenceName: recurring_classifier_token_counts_id_seq

        # Tables (dependency order)
        - createTable:
            tableName: organization
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: organizations_pkey
                    nullable: false
              - column:
                  name: created_at
                  type: "timestamp(6) with time zone"
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: logo_data
                  type: bytea
              - column:
                  name: logo_content_type
                  type: varchar(100)

        - createTable:
            tableName: csv_profile
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: csv_profiles_pkey
                    nullable: false
              - column:
                  name: fingerprint
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: mapping_json
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: organization_id
                  type: bigint
                  constraints:
                    nullable: false

        - createTable:
            tableName: account
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: accounts_pkey
                    nullable: false
              - column:
                  name: iban
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: numeric(19, 4)
              - column:
                  name: balance_date
                  type: date
              - column:
                  name: organization_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: accounts_organization_id_fkey
                    references: organization(id)

        - addUniqueConstraint:
            tableName: account
            columnNames: iban, organization_id
            constraintName: accounts_iban_organization_id_key
        - addUniqueConstraint:
            tableName: account
            columnNames: iban, organization_id
            constraintName: ukaic8rybpygomla3bha46uj9x6
        - addUniqueConstraint:
            tableName: account
            columnNames: iban, organization_id
            constraintName: uknut0kwlddxigmk8knb4nlhvi6

