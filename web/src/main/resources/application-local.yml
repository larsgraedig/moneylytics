spring:
  datasource:
    url: jdbc:h2:mem:moneylyticsdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  security:
    oauth2:
      client:
        registration:
          apple:
            client-id: ${APPLE_CLIENT_ID:local-placeholder}
            client-secret: ${APPLE_CLIENT_SECRET:local-placeholder}
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:local-placeholder}
            client-secret: ${FACEBOOK_CLIENT_SECRET:local-placeholder}

app:
  frontend-url: http://localhost:5173
