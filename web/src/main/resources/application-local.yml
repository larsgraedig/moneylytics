logging:
  structured:
    format:
      console: ""

springdoc:
  api-docs:
    enabled: true

management:
  tracing:
    enabled: false

app:
  oauth2-success-redirect: http://localhost:5173

stripe:
  secret-key: sk_test_dummy
  webhook-secret: whsec_dummy
  price-id-monthly: price_dummy_monthly
  price-id-yearly: price_dummy_yearly
  publishable-key: pk_test_dummy

spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-dummy}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-dummy}
  datasource:
    url: jdbc:postgresql://localhost:5433/moneylyticsdb
    username: moneylytics
    password: moneylytics
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      initialize-schema: always
