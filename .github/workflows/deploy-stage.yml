name: Deploy Stage

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy to Stage
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # Backend
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Push backend image
        run: ./gradlew :web:jib
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Frontend
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64,linux/amd64
          push: true
          tags: larsu/moneylytics-frontend:${{ env.COMMIT_HASH }}

      # Deploy
      - name: Set up WireGuard
        run: |
          sudo apt-get update && sudo apt-get install -y wireguard
          sudo install -m 600 /dev/null /etc/wireguard/wg0.conf
          printf '%s' "${{ secrets.WG_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo wg-quick up wg0

      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGE }}" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy to stage
        run: |
          helm upgrade --install moneylytics deployment/api \
            -f deployment/api/values-stage.yaml \
            --namespace moneylytics-stage \
            --kube-context moneylytics-stage \
            --set image.tag=$COMMIT_HASH \
            --set frontend.image.tag=$COMMIT_HASH

      - name: Tear down WireGuard
        if: always()
        run: sudo wg-quick down wg0 || true
