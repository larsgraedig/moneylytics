name: Deploy Monitoring Stack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deployment/monitoring/**'

jobs:
  deploy:
    name: Deploy Monitoring to Cluster
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up WireGuard
        run: |
          sudo apt-get update && sudo apt-get install -y wireguard
          sudo install -m 600 /dev/null /etc/wireguard/wg0.conf
          printf '%s' "${{ secrets.WG_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo wg-quick up wg0

      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Add Helm repos
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Ensure grafana-admin secret
        run: |
          kubectl create secret generic grafana-admin \
            -n monitoring \
            --context moneylytics \
            --from-literal=admin-user=admin \
            --from-literal=admin-password='${{ secrets.GRAFANA_ADMIN_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Reset stuck Helm releases
        run: |
          for release in kube-prometheus-stack loki promtail tempo moneylytics-dashboards; do
            STATUS=$(helm status "$release" -n monitoring --kube-context moneylytics -o json 2>/dev/null | jq -r '.info.status' || echo "not-found")
            if [[ "$STATUS" == "pending-install" || "$STATUS" == "pending-upgrade" || "$STATUS" == "pending-rollback" ]]; then
              echo "Resetting stuck release: $release (status: $STATUS)"
              helm uninstall "$release" -n monitoring --kube-context moneylytics || true
            fi
          done

      - name: Deploy kube-prometheus-stack
        run: |
          helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
            -n monitoring \
            --kube-context moneylytics \
            -f deployment/monitoring/kube-prometheus-stack-values.yaml \
            --timeout 10m \
            --cleanup-on-fail

      - name: Deploy Loki
        run: |
          helm upgrade --install loki grafana/loki \
            -n monitoring \
            --kube-context moneylytics \
            -f deployment/monitoring/loki-values.yaml \
            --cleanup-on-fail

      - name: Deploy Promtail
        run: |
          helm upgrade --install promtail grafana/promtail \
            -n monitoring \
            --kube-context moneylytics \
            -f deployment/monitoring/promtail-values.yaml \
            --cleanup-on-fail

      # To re-enable Tempo: replace this step with the deploy step below
      # - name: Deploy Tempo
      #   run: |
      #     helm upgrade --install tempo grafana/tempo \
      #       -n monitoring \
      #       --kube-context moneylytics \
      #       -f deployment/monitoring/tempo-values.yaml \
      #       --cleanup-on-fail
      - name: Uninstall Tempo (currently disabled)
        run: helm uninstall tempo -n monitoring --kube-context moneylytics 2>/dev/null || true

      - name: Deploy Dashboards
        run: |
          helm upgrade --install moneylytics-dashboards ./deployment/monitoring/dashboards \
            -n monitoring \
            --kube-context moneylytics \
            --cleanup-on-fail

      - name: Apply Alert Rules
        if: false  # disabled until Prometheus is re-enabled
        run: kubectl apply -f deployment/monitoring/alerts/ --context moneylytics

      - name: Tear down WireGuard
        if: always()
        run: sudo wg-quick down wg0 || true
