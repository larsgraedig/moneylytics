{{- $folders := list "Moneylytics" "Kubernetes" "Misc" }}
{{- range $folder := $folders }}
{{- range $path, $bytes := $.Files.Glob (printf "files/%s/*.json" $folder) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ base $path | trimSuffix ".json" | replace "_" "-" }}
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: {{ $folder }}
data:
  {{ base $path }}: |
{{ $bytes | toString | indent 4 }}
{{- end }}
{{- end }}
