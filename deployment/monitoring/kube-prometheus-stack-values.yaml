grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  persistence:
    enabled: true
    size: 2Gi

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring

  alerting:
    rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: moneylytics-backend
          folder: Moneylytics
          interval: 5m
          rules:
            - uid: moneylytics-error-log-alert
              title: Backend Error Log
              condition: A
              data:
                - refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: loki
                  model:
                    expr: 'sum(count_over_time({service_name="api", container="moneylytics", log_level="ERROR"} [5m]))'
                    queryType: range
                    refId: A
              noDataState: OK
              execErrState: Error
              for: 0s
              annotations:
                summary: "Error log in moneylytics backend"
                description: "At least one ERROR log was detected in the last 5 minutes."
              labels:
                severity: warning

  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki-gateway.monitoring.svc.cluster.local
      jsonData:
        maxLines: 1000
    # Tempo datasource disabled until Tempo is re-enabled
    # - name: Tempo
    #   type: tempo
    #   uid: tempo
    #   url: http://tempo.monitoring.svc.cluster.local:3100
    #   jsonData:
    #     tracesToLogsV2:
    #       datasourceUid: loki
    #       tags:
    #         - key: namespace
    #         - key: pod
    #       filterByTraceID: true

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - grafana.moneylytics.io
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.moneylytics.io

