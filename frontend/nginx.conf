server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(transactions|accounts|categories|users|thresholds|budgets|collections|auth|oauth2|login|admin|organizations|invitations) {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ml {
        rewrite ^/ml/?(.*)$ /$1 break;
        try_files $uri @ml_spa;
    }

    location @ml_spa {
        try_files /index.html =404;
    }

    location / {
        return 404;
    }
}
