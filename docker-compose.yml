services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moneylyticsdb
      POSTGRES_USER: moneylytics
      POSTGRES_PASSWORD: moneylytics
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U moneylytics -d moneylyticsdb" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
