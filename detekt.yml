style:
  MaxLineLength:
    # handled by ktlint
    active: false
  DataClassShouldBeImmutable:
    active: true
  MagicNumber:
    active: true
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
  ReturnCount:
    max: 6
  ThrowsCount:
    max: 6
  SerialVersionUIDInSerializableClass:
    # JPA composite key classes don't need serialVersionUID in Kotlin
    active: false
complexity:
  LongParameterList:
    ignoreAnnotated:
      - jakarta.persistence.Entity
      - jakarta.persistence.Embeddable
  LongMethod:
    allowedLines: 90
  CyclomaticComplexMethod:
    allowedComplexity: 30
  TooManyFunctions:
    allowedFunctionsPerClass: 25
    allowedFunctionsPerInterface: 25
    allowedFunctionsPerObject: 25
    allowedFunctionsPerFile: 25
